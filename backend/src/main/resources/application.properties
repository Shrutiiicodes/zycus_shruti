server.port=8080

spring.datasource.url=jdbc:h2:mem:stockpulse
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# commerce.strategy: rule-based | ai — read per-request, so this can be flipped without restart
commerce.strategy=rule-based

# demand spike trigger: velocity above this multiple of category average
agentic.spike-multiplier=3

# LLM — fill in once you paste the Qwen curl details
llm.provider=qwen
llm.api-key=${LLM_API_KEY:}
llm.model=qwen-cursor
llm.base-url=https://litellm-qc.zycus.net/v1
llm.product-header=${LLM_PRODUCT_HEADER:PC1}
llm.cookie=${LLM_COOKIE:}

cors.allowed-origin=http://localhost:5173